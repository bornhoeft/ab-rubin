<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#ffffff"/>

  <!-- Gruppenverbindungen: je vier Lautsprecher spielen denselben Kanal -->
  <g stroke="#bbbbbb" stroke-width="10" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <polyline points="200,80 80,80 80,320"/>
    <polyline points="320,80 320,320 200,320"/>
  </g>

  <!-- Hörposition -->
  <g stroke="#000000" stroke-width="1.5" fill="none">
    <circle cx="200" cy="200" r="10"/>
    <line x1="190" y1="200" x2="210" y2="200"/>
    <line x1="200" y1="190" x2="200" y2="210"/>
  </g>

  <!-- Lautsprecher -->
  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <rect x="58"  y="58"  width="44" height="44" rx="4"/>
    <rect x="178" y="58"  width="44" height="44" rx="4"/>
    <rect x="298" y="58"  width="44" height="44" rx="4"/>
    <rect x="298" y="178" width="44" height="44" rx="4"/>
    <rect x="298" y="298" width="44" height="44" rx="4"/>
    <rect x="178" y="298" width="44" height="44" rx="4"/>
    <rect x="58"  y="298" width="44" height="44" rx="4"/>
    <rect x="58"  y="178" width="44" height="44" rx="4"/>
  </g>

  <!-- Kanalnummern: 1 1 2 2 2 2 1 1 (im Uhrzeigersinn ab oben links) -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold"
     text-anchor="middle" dominant-baseline="central" fill="#000000">
    <text x="80"  y="80">1</text>
    <text x="200" y="80">1</text>
    <text x="320" y="80">2</text>
    <text x="320" y="200">2</text>
    <text x="320" y="320">2</text>
    <text x="200" y="320">2</text>
    <text x="80"  y="320">1</text>
    <text x="80"  y="200">1</text>
  </g>
</svg>
